# Generic deployment shape: app + postgres on a private network.
# Secrets come from an untracked env file and a mounted secrets directory —
# never inline. CUSTOS_DB_PASSWORD must be URL-safe (base64url recommended).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: custos
      # postgres image requires the env form; the DB is unreachable outside
      # the private network (no published port) — accepted exposure.
      POSTGRES_PASSWORD: ${CUSTOS_DB_PASSWORD:?set CUSTOS_DB_PASSWORD}
      POSTGRES_DB: custos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # DSN via file form: the password never appears in `docker inspect` env.
      CUSTOS_DATABASE_URL_FILE: /run/custos/database-url
      CUSTOS_SECRETS_KEY_FILE: /run/custos/keyring
      CUSTOS_PEPPER_FILE: /run/custos/pepper
      CUSTOS_BIND: "0.0.0.0"
      CUSTOS_PUBLIC_BIND: "1"
      # No default: trusting all docker ranges would trust sibling containers.
      # Set to the reverse proxy's actual address/CIDR.
      CUSTOS_TRUSTED_PROXIES: ${CUSTOS_TRUSTED_PROXIES:?set CUSTOS_TRUSTED_PROXIES}
      CUSTOS_ALLOWED_ORIGINS: ${CUSTOS_ALLOWED_ORIGINS:?set CUSTOS_ALLOWED_ORIGINS}
      CUSTOS_WEBAUTHN_RP_ID: ${CUSTOS_WEBAUTHN_RP_ID:?set CUSTOS_WEBAUTHN_RP_ID}
      CUSTOS_DATA_DIR: /var/lib/custos
    volumes:
      # Directory mount (single-file binds break on atomic-replace rotation).
      # The directory must contain ONLY regular 0600/0400 files owned by
      # (or readable as) uid 10001: keyring, pepper, database-url (DSN with
      # the URL-safe password).
      - ${CUSTOS_SECRETS_DIR:?set CUSTOS_SECRETS_DIR}:/run/custos:ro
      - appdata:/var/lib/custos
    ports:
      - "127.0.0.1:${CUSTOS_PORT:-8300}:8300"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  appdata:

networks:
  internal:
